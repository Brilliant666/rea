name: Sync upstream safely

on:
  schedule:
    # Daily at 06:23 Asia/Shanghai.
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Brilliant666/rea' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge upstream and push without force
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SSH_KEY: ${{ secrets.REA_UPSTREAM_SYNC_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SYNC_SSH_KEY" || { echo '::error::Missing sync deploy key'; exit 1; }
          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name')
          test "$parent" = 'morluto/rea' || { echo '::error::Unexpected upstream'; exit 1; }

          # Work in a disposable checkout; never execute upstream code or hooks.
          work=$(mktemp -d "$RUNNER_TEMP/rea-sync.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          git init "$work/repo"
          cd "$work/repo"
          git config core.hooksPath /dev/null
          git config user.name 'REA upstream sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags origin main
          git checkout -b main FETCH_HEAD
          before=$(git rev-parse HEAD)
          git fetch --no-tags upstream main
          upstream=$(git rev-parse FETCH_HEAD)
          if ! git merge --no-edit "$upstream"; then
            echo '::error::Upstream merge failed. Nothing was pushed; resolve conflicts manually.'
            echo '### Sync stopped: merge failed; remote changes preserved' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [[ "$before" != "$after" ]]; then
            # Repository-scoped deploy key allows workflow-file updates.
            # Obtain trusted SSH host keys over authenticated HTTPS, not ssh-keyscan.
            umask 077
            printf '%s\n' "$SYNC_SSH_KEY" > "$work/key"
            unset SYNC_SSH_KEY
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$work/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $work/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$work/known_hosts"
            git remote set-url --push origin "git@github.com:$GITHUB_REPOSITORY.git"
            # Normal push rejects concurrent remote edits. Never force or reset.
            git push origin HEAD:refs/heads/main
          fi
          {
            echo '### Upstream sync succeeded'
            echo "Upstream: $upstream"
            echo "Before: $before"
            echo "After: $after"
          } >> "$GITHUB_STEP_SUMMARY"
