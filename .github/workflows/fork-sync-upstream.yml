name: Sync upstream safely

on:
  schedule:
    # Daily at 06:23 Asia/Shanghai (22:23 UTC on the previous day).
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Brilliant666/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream without overwriting local changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name')
          if [[ "$parent" != "morluto/rea" ]]; then
            echo '::error::Unexpected upstream repository; synchronization stopped.'
            exit 1
          fi
          # GitHub performs a normal merge atomically. A conflict returns HTTP 409.
          # Never reset, force-push, or choose one side to resolve conflicts.
          if gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" \
            -f branch=main > "$RUNNER_TEMP/upstream-sync.json"; then
            echo '### Upstream synchronization succeeded' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.message, ("Commit: " + .base_branch)' \
              "$RUNNER_TEMP/upstream-sync.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Synchronization failed. Resolve conflicts or permissions manually; no force overwrite was attempted.'
            echo '### Upstream synchronization stopped' >> "$GITHUB_STEP_SUMMARY"
            echo 'Check the log for conflicts or permission errors. No force overwrite was attempted.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
